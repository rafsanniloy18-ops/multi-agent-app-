<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Multi-Agent AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <i class="fa-solid fa-bolt text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Fast Multi-Agent AI</h1>
                <p class="text-xs text-green-400" id="keyStatusDisplay">0 API Keys Loaded</p>
            </div>
        </div>
        <button onclick="toggleSettingsModal()" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-2 rounded-lg text-sm flex items-center gap-2 border border-gray-600 transition">
            <i class="fa-solid fa-gear"></i> Settings
        </button>
    </header>

    <!-- Chat Box -->
    <main id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full">
        <div class="flex gap-3 my-4">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center shrink-0 text-white text-xs font-bold">AI</div>
            <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl rounded-tl-none max-w-[85%] text-sm leading-relaxed">
                হ্যালো! আপনার Gemini API Key দিয়ে মেসেজ দিন, ৩-৪ সেকেন্ডে সুপার-ফাস্ট রিপ্লাই পাবেন!
            </div>
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="p-4 bg-gray-900 border-t border-gray-800">
        <div class="max-w-4xl mx-auto flex gap-2 items-center bg-gray-800 p-2 rounded-xl border border-gray-700">
            <textarea id="userInput" rows="1" class="flex-1 bg-transparent border-none text-sm text-white focus:outline-none resize-none px-2 max-h-32" placeholder="Write your task..." onkeydown="handleKeyPress(event)"></textarea>
            <button onclick="sendMessage()" id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-lg transition shrink-0 flex items-center justify-center w-10 h-10">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </footer>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 border border-gray-700 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <h2 class="text-xl font-bold mb-2 text-white flex items-center gap-2">
                <i class="fa-solid fa-key text-blue-400"></i> API Keys Settings
            </h2>
            <p class="text-xs text-gray-400 mb-4">Gemini API Keys (Comma separated or new line):</p>
            <textarea id="apiKeysInput" rows="6" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-xs font-mono text-green-400 focus:outline-none focus:border-blue-500 mb-4" placeholder="AIzaSyA..."></textarea>
            <div class="flex justify-end">
                <button onclick="toggleSettingsModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold">
                    Save & Close
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentKeyIndex = 0;

        function toggleSettingsModal() {
            document.getElementById('settingsModal').classList.toggle('hidden');
            updateKeyCount();
        }

        function getApiKeys() {
            const raw = document.getElementById('apiKeysInput').value;
            return raw.split(/[\n,]+/).map(k => k.trim()).filter(k => k.length > 0);
        }

        function updateKeyCount() {
            document.getElementById('keyStatusDisplay').innerText = `${getApiKeys().length} API Keys Loaded`;
        }

        document.getElementById('apiKeysInput').addEventListener('input', updateKeyCount);

        function getNextApiKey(keys) {
            if (keys.length === 0) return null;
            const key = keys[currentKeyIndex];
            currentKeyIndex = (currentKeyIndex + 1) % keys.length;
            return key;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function appendMessage(sender, text, isUser = false) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-3 my-3 ${isUser ? 'justify-end' : ''}`;

            msgDiv.innerHTML = `
                ${!isUser ? `<div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center shrink-0 text-white text-xs font-bold">AI</div>` : ''}
                <div class="${isUser ? 'bg-blue-600 text-white' : 'bg-gray-800 border border-gray-700 text-gray-200'} p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed whitespace-pre-wrap font-mono">
                    ${sender ? `<strong class="block text-xs mb-1 text-blue-400 font-sans">${sender}</strong>` : ''}${text}
                </div>
                ${isUser ? `<div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center shrink-0 text-white text-xs font-bold">You</div>` : ''}
            `;

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        async function callGemini(prompt, apiKey) {
            // Updated exact Gemini endpoint to prevent 404/Invalid Model errors
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            return data.candidates[0].content.parts[0].text;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            const keys = getApiKeys();

            if (!prompt) return;
            if (keys.length === 0) {
                alert("Please add a valid API Key in Settings!");
                toggleSettingsModal();
                return;
            }

            appendMessage(null, prompt, true);
            input.value = '';

            const statusMsg = appendMessage("🤖 Multi-Agent AI", "টিম প্রসেস করছে...");

            try {
                const key = getNextApiKey(keys);
                
                // Single Prompt Multi-Agent Thinking Strategy (Fastest Execution)
                const multiAgentPrompt = `You are a Multi-Agent AI System (Specialist Coder, Code Reviewer, and Output Synthesizer working together).
Task: ${prompt}

Execute as a team internally and directly output the cleanest, most perfected final solution.`;

                const responseText = await callGemini(multiAgentPrompt, key);

                statusMsg.remove();
                appendMessage("🤖 Multi-Agent Team Result", responseText);

            } catch (err) {
                statusMsg.querySelector('div').innerText = `❌ Error: ${err.message}`;
            }
        }
    </script>
</body>
</html>
